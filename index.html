<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14402f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heimkehrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314402f'/><text x='50' y='70' font-size='60' text-anchor='middle'>🂡</text></svg>">
<title>Heimkehrer</title>
<style>
:root{
  --felt:#14402f; --felt-2:#1c5640; --bg:#f4f1ea; --card:#ffffff; --ink:#1d1f1c; --muted:#6b6f68;
  --line:#e3ded2; --accent:#c8372d; --gold:#b8862b; --auto:#eef6f1; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1512; --card:#18211c; --ink:#ecebe6; --muted:#9aa39c; --line:#2a352f; --auto:#1f2e26; --felt:#103326; --felt-2:#17473a; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(160deg,var(--felt),var(--felt-2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px}
header h1{margin:0;font-size:20px;letter-spacing:.5px;font-weight:700}
header .sub{opacity:.75;font-size:13px;margin-top:2px}
.dealer{margin-top:12px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.dealer[hidden]{display:none}
.dealer .chip{font-size:26px}
.dealer b{font-size:18px}
.dealer small{display:block;opacity:.75;font-size:12px}
main{max-width:560px;margin:0 auto;padding:14px 16px 40px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:0 0 10px;font-weight:600}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.score{text-align:center;padding:10px 4px;border-radius:12px;background:var(--bg)}
.score.lead{outline:2px solid var(--gold)}
.score .n{font-weight:600;font-size:15px}
.score .day{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.score .all{font-size:12px;color:var(--muted)}
.score .wins{font-size:12px;color:var(--gold);min-height:16px}
.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inputs label{display:block;font-size:13px;font-weight:600;text-align:center;margin-bottom:4px}
.inputs input{width:100%;font-size:26px;text-align:center;padding:10px 4px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.inputs input:focus{outline:none;border-color:var(--felt-2)}
.inputs input.auto{background:var(--auto);border-style:dashed}
.hint{font-size:13px;color:var(--muted);min-height:18px;margin:8px 0 2px;text-align:center}
.hint.err{color:var(--accent)}
.hint.sweep{color:var(--gold);font-weight:600}
button{font:inherit;border:0;border-radius:12px;padding:13px 14px;font-weight:600;cursor:pointer}
.primary{background:var(--felt-2);color:#fff;width:100%;font-size:17px;margin-top:8px}
.primary:disabled{opacity:.4}
.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.danger{color:var(--accent)}
.row{display:flex;gap:8px}
.row>*{flex:1}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r{color:var(--muted);font-size:13px;text-align:left}
td.zero{color:var(--gold);font-weight:700}
tr.sum td{font-weight:700;border-bottom:0}
.empty{color:var(--muted);text-align:center;font-size:14px;padding:6px 0}
.day-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.day-item:last-child{border-bottom:0}
.day-item .w{color:var(--gold);font-weight:700}
.day-item .t{color:var(--muted);font-size:12px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.pick button{background:var(--bg);border:1.5px solid var(--line);color:var(--ink)}
.pick button.on{border-color:var(--felt-2);background:var(--auto)}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:14px}
.setting select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.banner{background:#fff3cd;color:#6a4b00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.share{word-break:break-all;font-size:13px;background:var(--bg);padding:8px;border-radius:8px;margin:8px 0}
.status{font-size:12px;opacity:.7;margin-left:auto}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:baseline"><h1>🂡 Heimkehrer</h1><span class="status" id="status"></span></div>
  <div class="sub" id="subline">Chris · Tobi · Stanzl</div>
  <div class="dealer" id="dealerBox" hidden>
    <span class="chip">🃏</span>
    <div><small>Teilt aus</small><b id="dealerName"></b></div>
    <div style="margin-left:auto;text-align:right"><small>danach</small><span id="dealerNext"></span></div>
  </div>
</header>
<main id="app"><p class="empty">Lädt …</p></main>

<script type="module">
/* ============ KONFIGURATION ============
   Hier die Werte aus Firebase einfügen (siehe ANLEITUNG.md, Schritt 2).
   Solange apiKey leer ist, läuft die Seite im Demo-Modus (nur auf diesem Gerät). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDlsDiNb2fJQoudNMB5UR9nLZ3RVCFCA48",
  authDomain: "heimkehrer-ff6b3.firebaseapp.com",
  projectId: "heimkehrer-ff6b3",
  storageBucket: "heimkehrer-ff6b3.firebasestorage.app",
  messagingSenderId: "41174541428",
  appId: "1:41174541428:web:9af5ca57d5db65efd75d21"
};
/* ======================================= */

const PLAYERS = ['Chris', 'Tobi', 'Stanzl'];
const TOTAL = 115;
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';

const state = { rounds: [], sessions: [], meta: {} };
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtDate = ts => new Date(ts).toLocaleDateString('de-AT', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' });
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

/* ---------- Zugangsschlüssel (steht im geteilten Link) ---------- */
function getKey() {
  const m = location.hash.match(/k=([A-Za-z0-9]{20,})/);
  if (m) { store.set('hk_key', m[1]); return m[1]; }
  const k = store.get('hk_key');
  if (!k || k.length < 20) return null;   // alte, zu kurze Schlüssel verwerfen
  history.replaceState(null, '', '#k=' + k);
  return k;
}
function newKey() {
  const a = new Uint8Array(24); crypto.getRandomValues(a);
  return Array.from(a, b => 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 56]).join('');
}

/* ---------- Speicher: Firebase oder Demo ---------- */
async function firebaseBackend(key) {
  const { initializeApp } = await import(FB + 'firebase-app.js');
  const fs = await import(FB + 'firebase-firestore.js');
  const app = initializeApp(FIREBASE_CONFIG);
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache() }); }
  catch { db = fs.getFirestore(app); }
  const ref = (col, id) => fs.doc(db, 'spiele', key, col, id);
  return {
    subscribe(cb) {
      const err = e => setStatus('⚠︎ ' + (e.code || 'Fehler'));
      fs.onSnapshot(fs.collection(db, 'spiele', key, 'runden'), { includeMetadataChanges: true }, s => {
        state.rounds = s.docs.map(d => ({ id: d.id, ...d.data() }));
        setStatus(s.metadata.hasPendingWrites ? 'speichert …' : s.metadata.fromCache ? 'offline' : '● live');
        cb();
      }, err);
      fs.onSnapshot(fs.collection(db, 'spiele', key, 'spieltage'), s => {
        state.sessions = s.docs.map(d => ({ id: d.id, ...d.data() })); cb();
      }, err);
      fs.onSnapshot(ref('meta', 'zustand'), s => { state.meta = s.data() || {}; cb(); }, err);
    },
    put: (col, id, data) => fs.setDoc(ref(col, id), data),
    patch: (col, id, data) => fs.setDoc(ref(col, id), data, { merge: true }),
    remove: (col, id) => fs.deleteDoc(ref(col, id)),
    setMeta: data => fs.setDoc(ref('meta', 'zustand'), data, { merge: true })
  };
}
function demoBackend() {
  let cb = () => {};
  const load = () => {
    try { Object.assign(state, JSON.parse(store.get('hk_demo')) || {}); } catch {}
  };
  const save = () => { store.set('hk_demo', JSON.stringify(state)); cb(); };
  const list = col => col === 'runden' ? state.rounds : state.sessions;
  return {
    subscribe(f) { cb = f; load(); setStatus('Demo'); cb(); },
    put(col, id, data) { const l = list(col); const i = l.findIndex(x => x.id === id); i >= 0 ? l[i] = { id, ...data } : l.push({ id, ...data }); save(); },
    patch(col, id, data) { const x = list(col).find(x => x.id === id); Object.assign(x, data); save(); },
    remove(col, id) { if (col === 'runden') state.rounds = state.rounds.filter(x => x.id !== id); else state.sessions = state.sessions.filter(x => x.id !== id); save(); },
    setMeta(data) { Object.assign(state.meta, data); save(); }
  };
}
function setStatus(t) { $('#status').textContent = t; }

/* ---------- Berechnungen ---------- */
const sum3 = rs => rs.reduce((a, r) => a.map((v, i) => v + r.s[i]), [0, 0, 0]);
const lowWins = () => state.meta.lowWins !== false;
function leaders(tot) {
  const best = lowWins() ? Math.min(...tot) : Math.max(...tot);
  return tot.map((v, i) => v === best ? i : -1).filter(i => i >= 0);
}
function curSession() { return state.sessions.find(s => s.id === state.meta.currentSid && !s.end) || null; }
function sessionRounds(sid) { return state.rounds.filter(r => r.sid === sid).sort((a, b) => a.ts - b.ts); }
function winTally() {
  const w = [0, 0, 0];
  state.sessions.forEach(s => (s.winners || []).forEach(i => w[i]++));
  return w;
}

/* ---------- Eingabe-Logik: 2 eintragen, 3. füllt sich ---------- */
let typed = [false, false, false];
function autoFill() {
  const ins = [...document.querySelectorAll('.inputs input')];
  const val = ins.map(i => i.value === '' ? null : Number(i.value));
  const filled = typed.map((t, i) => t && val[i] !== null);
  const n = filled.filter(Boolean).length;
  const hint = $('#hint');
  hint.className = 'hint';
  ins.forEach((inp, i) => { if (!typed[i]) { inp.value = ''; inp.classList.remove('auto'); } });
  if (n === 2) {
    const k = filled.indexOf(false);
    const [a, b] = val.filter((_, i) => filled[i]);
    let v;
    if ((a === 0 && b === TOTAL) || (a === TOTAL && b === 0)) v = TOTAL;   // Durchmarsch
    else v = TOTAL - a - b;
    if (v >= 0) { ins[k].value = v; ins[k].classList.add('auto'); }
    else { $('#save').disabled = true; hint.textContent = 'Zusammen schon ' + (a + b) + ' – mehr als ' + TOTAL + '.'; hint.className = 'hint err'; return; }
  }
  const res = readRound();
  $('#save').disabled = !res.ok;
  if (res.sweep !== undefined) { hint.textContent = '★ Durchmarsch von ' + PLAYERS[res.sweep] + '!'; hint.className = 'hint sweep'; }
  else if (res.msg) { hint.textContent = res.msg; hint.className = 'hint' + (res.bad ? ' err' : ''); }
  else hint.textContent = '';
}
function readRound() {
  const ins = [...document.querySelectorAll('.inputs input')];
  if (ins.some(i => i.value === '')) return { ok: false, msg: 'Zwei Spieler eintragen – der dritte ergänzt sich.' };
  const s = ins.map(i => Number(i.value));
  if (s.some(v => !Number.isInteger(v) || v < 0 || v > TOTAL)) return { ok: false, bad: true, msg: 'Nur Werte von 0 bis ' + TOTAL + '.' };
  const zeros = s.filter(v => v === 0).length, fulls = s.filter(v => v === TOTAL).length;
  if (zeros === 1 && fulls === 2) return { ok: true, s, sweep: s.indexOf(0) };
  const sum = s.reduce((a, b) => a + b, 0);
  if (sum !== TOTAL) return { ok: false, bad: true, msg: 'Summe ist ' + sum + ' statt ' + TOTAL + '.' };
  return { ok: true, s };
}

/* ---------- Aktionen ---------- */
let api, pickDealer = 0;
async function saveRound() {
  const res = readRound(); const ses = curSession();
  if (!res.ok || !ses) return;
  const d = state.meta.dealer ?? 0;
  await Promise.all([
    api.put('runden', uid(), { sid: ses.id, s: res.s, d, ts: Date.now() }),
    api.setMeta({ dealer: (d + 1) % 3 })
  ]);
  typed = [false, false, false];
  render();
  const first = document.querySelector('.inputs input'); if (first) first.focus();
}
async function undoLast() {
  const ses = curSession(); const rs = ses ? sessionRounds(ses.id) : [];
  const last = rs[rs.length - 1]; if (!last) return;
  if (!confirm('Letzte Runde (' + last.s.join(' / ') + ') löschen?')) return;
  await Promise.all([api.remove('runden', last.id), api.setMeta({ dealer: last.d })]);
}
async function startSession() {
  const id = uid();
  await api.put('spieltage', id, { start: Date.now(), end: null, winners: null, totals: null });
  await api.setMeta({ currentSid: id, dealer: pickDealer });
}
async function endSession() {
  const ses = curSession(); if (!ses) return;
  const rs = sessionRounds(ses.id);
  if (!rs.length) { if (confirm('Spieltag ohne Runden verwerfen?')) { await api.remove('spieltage', ses.id); await api.setMeta({ currentSid: null }); } return; }
  const tot = sum3(rs); const w = leaders(tot);
  if (!confirm('Spieltag beenden?\nSieger: ' + w.map(i => PLAYERS[i]).join(' & ') + ' (' + tot.join(' / ') + ')')) return;
  await api.patch('spieltage', ses.id, { end: Date.now(), winners: w, totals: tot, rounds: rs.length });
  await api.setMeta({ currentSid: null });
}

/* ---------- Darstellung ---------- */
function render() {
  const app = $('#app'); const ses = curSession();
  const allTot = sum3(state.rounds); const wins = winTally();
  const rs = ses ? sessionRounds(ses.id) : [];
  const dayTot = sum3(rs);
  const lead = rs.length ? leaders(dayTot) : [];
  const d = state.meta.dealer ?? 0;

  $('#dealerBox').hidden = !ses;
  if (ses) { $('#dealerName').textContent = PLAYERS[d]; $('#dealerNext').textContent = PLAYERS[(d + 1) % 3]; }
  $('#subline').textContent = ses ? 'Spieltag ' + fmtDate(ses.start) + ' · Runde ' + (rs.length + 1) : 'Chris · Tobi · Stanzl';

  const focused = document.activeElement && document.activeElement.dataset.i;
  const oldVals = [...document.querySelectorAll('.inputs input')].map(i => i.value);

  let h = '';
  if (!FIREBASE_CONFIG.apiKey) h += '<div class="banner">Demo-Modus: Daten bleiben nur auf diesem Gerät. Firebase-Werte oben in <code>index.html</code> eintragen, dann teilen alle denselben Stand.</div>';

  h += '<section><h2>' + (ses ? 'Tagesstand' : 'Gesamtstand') + '</h2><div class="scores">' + PLAYERS.map((p, i) => `
    <div class="score${lead.includes(i) ? ' lead' : ''}">
      <div class="n">${p}</div>
      <div class="day">${ses ? dayTot[i] : allTot[i]}</div>
      <div class="all">${ses ? 'gesamt ' + allTot[i] : '&nbsp;'}</div>
      <div class="wins">${wins[i] ? '🏆 ' + wins[i] : ''}</div>
    </div>`).join('') + '</div></section>';

  if (ses) {
    h += '<section><h2>Neue Runde</h2><div class="inputs">' + PLAYERS.map((p, i) => `
      <div><label for="in${i}">${p}${i === d ? ' 🃏' : ''}</label>
      <input id="in${i}" data-i="${i}" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="${i < 2 ? 'next' : 'done'}" autocomplete="off" maxlength="3"></div>`).join('') +
      '</div><div class="hint" id="hint"></div><button class="primary" id="save" disabled>Runde speichern</button></section>';

    h += '<section><h2>Runden heute</h2>';
    if (!rs.length) h += '<p class="empty">Noch keine Runde gespielt.</p>';
    else {
      let run = [0, 0, 0];
      const rows = rs.map((r, k) => { run = run.map((v, i) => v + r.s[i]);
        return `<tr><td class="r">${k + 1}. <span title="Geber">${PLAYERS[r.d][0]}</span></td>${r.s.map(v => `<td class="${v === 0 ? 'zero' : ''}">${v}</td>`).join('')}</tr>`; });
      h += '<table><thead><tr><th></th>' + PLAYERS.map(p => '<th>' + p + '</th>').join('') + '</tr></thead><tbody>' +
        rows.reverse().join('') + '<tr class="sum"><td class="r">Σ</td>' + dayTot.map(v => '<td>' + v + '</td>').join('') + '</tr></tbody></table>';
      h += '<div class="row" style="margin-top:10px"><button class="ghost" id="undo">↶ Letzte Runde löschen</button></div>';
    }
    h += '</section><section><button class="ghost danger" id="end" style="width:100%">Spieltag beenden &amp; Sieger eintragen</button></section>';
  } else {
    h += '<section><h2>Neuer Spieltag</h2><div style="font-size:14px">Wer teilt zuerst aus?</div><div class="pick">' +
      PLAYERS.map((p, i) => `<button data-pick="${i}" class="${i === pickDealer ? 'on' : ''}">${p}</button>`).join('') +
      '</div><button class="primary" id="start">Spieltag starten</button></section>';
  }

  const done = state.sessions.filter(s => s.end).sort((a, b) => b.start - a.start);
  h += '<section><h2>Spieltage · Siege ' + PLAYERS.map((p, i) => p + ' ' + wins[i]).join(' · ') + '</h2>';
  h += done.length ? done.map(s => `<div class="day-item"><div>${fmtDate(s.start)}<div class="t">${s.totals.join(' / ')} · ${s.rounds || '?'} Runden</div></div>
      <div class="w">🏆 ${s.winners.map(i => PLAYERS[i]).join(' & ')}</div></div>`).join('') : '<p class="empty">Noch kein Spieltag abgeschlossen.</p>';
  h += '</section>';

  h += `<section><details><summary>Einstellungen &amp; Teilen</summary>
    <div class="setting"><span>Sieger ist, wer …</span><select id="dir">
      <option value="low" ${lowWins() ? 'selected' : ''}>am wenigsten Punkte hat</option>
      <option value="high" ${lowWins() ? '' : 'selected'}>am meisten Punkte hat</option></select></div>
    ${ses ? '<div class="setting"><span>Geber korrigieren</span><select id="dealerSel">' + PLAYERS.map((p, i) => `<option value="${i}" ${i === d ? 'selected' : ''}>${p}</option>`).join('') + '</select></div>' : ''}
    <div style="margin-top:12px;font-size:14px">Link für Tobi &amp; Stanzl:</div>
    <div class="share">${location.href}</div>
    <button class="ghost" id="copy" style="width:100%">Link kopieren</button>
    </details></section>`;

  app.innerHTML = h;

  // Eingaben nach Neuzeichnen wiederherstellen
  const ins = [...document.querySelectorAll('.inputs input')];
  ins.forEach((inp, i) => {
    if (typed[i] && oldVals[i] !== undefined) inp.value = oldVals[i];
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '').slice(0, 3);
      typed[i] = inp.value !== '';
      if (inp.classList.contains('auto')) inp.classList.remove('auto');
      autoFill();
      // nach 3 Ziffern oder eindeutigem Wert zum nächsten leeren Feld springen
      if (inp.value === '0' || inp.value.length === 3 || Number(inp.value) * 10 > TOTAL) {
        const next = ins.find((x, j) => j > i && !typed[j]);
        if (next && typed.filter(Boolean).length < 2) next.focus();
      }
    });
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const next = ins.find((x, j) => j > i && !typed[j]);
      if (typed.filter(Boolean).length < 2 && next) next.focus(); else saveRound();
    });
  });
  if (ins.length) { autoFill(); if (focused) ins[focused]?.focus(); }

  $('#save')?.addEventListener('click', saveRound);
  $('#undo')?.addEventListener('click', undoLast);
  $('#end')?.addEventListener('click', endSession);
  $('#start')?.addEventListener('click', startSession);
  document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { pickDealer = +b.dataset.pick; render(); }));
  $('#dir')?.addEventListener('change', e => api.setMeta({ lowWins: e.target.value === 'low' }));
  $('#dealerSel')?.addEventListener('change', e => api.setMeta({ dealer: +e.target.value }));
  $('#copy')?.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(location.href); $('#copy').textContent = 'Kopiert ✓'; }
    catch { prompt('Link kopieren:', location.href); }
  });
}

/* ---------- Start ---------- */
async function boot() {
  if (!FIREBASE_CONFIG.apiKey) { api = demoBackend(); api.subscribe(render); return; }
  let key = getKey();
  if (!key) {
    $('#app').innerHTML = `<section><h2>Willkommen</h2>
      <p style="font-size:15px">Für diese Seite fehlt noch der Zugangsschlüssel. Öffne den Link, den du bekommen hast – oder lege eine neue Spielrunde an (nur einmal, durch eine Person).</p>
      <button class="primary" id="create">Neue Spielrunde anlegen</button></section>`;
    $('#create').onclick = () => { key = newKey(); store.set('hk_key', key); location.hash = 'k=' + key; location.reload(); };
    return;
  }
  try { api = await firebaseBackend(key); api.subscribe(render); }
  catch (e) { $('#app').innerHTML = '<section><p class="hint err">Verbindung zu Firebase fehlgeschlagen: ' + (e.message || e) + '</p></section>'; }
}
boot();
</script>
</body>
</html>
